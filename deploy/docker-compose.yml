# x-hub 主控。所有业务参数（端口、面板路径、TLS、公开地址等）均在面板「设置」中修改，无需环境变量。
# 首次启动后执行 `docker logs xhub` 查看面板地址与初始密码。
services:
  xhub:
    image: ghcr.io/yuuuuu0/xhub-master:latest
    container_name: xhub
    restart: unless-stopped
    # host 网络：在面板修改监听端口后无需改端口映射，且能拿到真实客户端 IP
    network_mode: host
    volumes:
      - ./data:/data
      # 使用自有证书时取消注释，挂载证书所在目录（只读），再到「设置 → 访问」填写容器内路径。
      # 请挂载目录而非单个文件：续签替换文件后，单文件挂载看到的仍是旧文件。
      # certbot 的 live/ 是指向 archive/ 的符号链接，需挂载整个 /etc/letsencrypt。
      # - /etc/ssl/xhub:/certs:ro
