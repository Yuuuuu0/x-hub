# x-hub 主控。业务参数（面板路径、TLS、公开地址等）均在面板「设置」中修改，无需环境变量。
# 首次启动后执行 `docker logs xhub` 查看面板路径与初始密码。
services:
  xhub:
    image: ghcr.io/yuuuuu0/xhub-master:latest
    container_name: xhub
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。容器内固定监听 2096，宿主机端口被占用时只改左侧，
      # 并在面板「设置 → 访问」把公开访问地址改成对应端口。
      # 前置 Nginx / Caddy 反代时改为 "127.0.0.1:2096:2096"，只对本机开放。
      - "2096:2096"
    volumes:
      - ./data:/data
      # 使用自有证书时取消注释，挂载证书所在目录（只读），再到「设置 → 访问」填写容器内路径。
      # 请挂载目录而非单个文件：续签替换文件后，单文件挂载看到的仍是旧文件。
      # certbot 的 live/ 是指向 archive/ 的符号链接，需挂载整个 /etc/letsencrypt。
      # - /etc/ssl/xhub:/certs:ro
