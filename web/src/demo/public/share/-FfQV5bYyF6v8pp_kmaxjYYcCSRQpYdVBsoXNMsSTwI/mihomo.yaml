    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇩🇪 德国节点"
      - "🏠 家宽"
      - "🌍 其他节点"
      - DIRECT
  - name: "🎬 流媒体"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇩🇪 德国节点"
      - "🇸🇬 新加坡节点"
      - "🇭🇰 香港节点"
      - DIRECT
  - name: "🇭🇰 香港节点"
    type: select
    proxies:
      - "🇭🇰 香港-hkt|📊1TB|⏳142D"
      - "🇭🇰 香港-cdn|📊1TB|⏳142D"
      - "[备用] 🇭🇰 香港 01"
      - "[备用] 🇭🇰 香港 02"
  - name: "🇯🇵 日本节点"
    type: select
    proxies:
      - "🇯🇵 日本-acck|📊2TB|⏳69D"
      - "🇯🇵 日本-xhttp|📊2TB|⏳69D"
      - "[备用] 🇯🇵 日本 01"
  - name: "🇺🇸 美国节点"
    type: select
    proxies:
      - "[备用] 🇺🇸 美国 01"
  - name: "🇸🇬 新加坡节点"
    type: select
    proxies:
      - "🇸🇬 新加坡-sg|📊1TB|⏳23D"
      - "🇸🇬 新加坡-trojan|📊1TB|⏳23D"
  - name: "🇩🇪 德国节点"
    type: select
    proxies:
      - DIRECT
  - name: "🏠 家宽"
    type: select
    proxies:
      - DIRECT
  - name: "🌍 其他节点"
    type: select
    proxies:
      - "🇺🇸 洛杉矶-cn2|📊3TB|⏳301D"
      - "[备用] 🇹🇼 台湾 01"
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🌐 日常上网"
      - "🎬 流媒体"
      - DIRECT
  - name: "🖧 本地直连"
    type: select
    proxies:
      - DIRECT
  - name: "🛡️ AdGuard"
    type: select
    proxies:
      - REJECT
