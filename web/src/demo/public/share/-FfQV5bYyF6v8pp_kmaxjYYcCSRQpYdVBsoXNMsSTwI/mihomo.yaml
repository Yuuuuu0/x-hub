mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
# 域名嗅探（可选）
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: false
    QUIC:
      ports: [443, 8443]
      override-destination: false
  skip-domain: # 忽略嗅探
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.wechat.com'
    - '+.qpic.cn'
    - '+.qq.com'
    - '+.wechatapp.com'
    #  语音通信
    - '+.vivox.com'
    # 向日葵服务
    - '+.oray.com'
    - '+.sunlogin.net'
  skip-dst-address:
    - '149.154.160.0/20'
    - '185.76.151.0/24'
    - '91.105.192.0/23'
    - '91.108.16.0/21'
    - '91.108.4.0/22'
    - '91.108.56.0/22'
    - '91.108.8.0/21'
    - '95.161.64.0/20'
    - '2001:67c:4e8::/48'
    - '2001:b28:f23c::/47'
    - '2001:b28:f23f::/48'
    - '2a0a:f280::/29'
    - '127.0.0.0/8' # 本机回环
    - '10.0.0.0/8' # A类私有
    - '172.16.0.0/12' # B类私有
    - '192.168.0.0/16' # C类私有
    - '169.254.0.0/16' # 链路本地
    - '224.0.0.0/4' # 组播地址
    - '240.0.0.0/4' # 保留地址
    - 'fc00::/7' # IPv6 ULA
    - 'fe80::/10' # IPv6 链路本地
    - '::1/128' # IPv6 本机回环
# DNS
dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.localhost"
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
profile:
  store-selected: true
  store-fake-ip: true
